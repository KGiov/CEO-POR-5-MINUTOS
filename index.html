const WILDCARDS=[19,18,23,24,25];
function wildcardCount(decisions){
  if(decisions<10)return 2;
  if(decisions<15)return 3;
  return decisions<20?4:5;
}
function buildRoundOrder(decisions){
  const early=EARLY_DECISIONS.slice(0,decisions-CLOSING_ROUNDS.length);
  const bonus=WILDCARDS.slice(0,wildcardCount(decisions));
  const order=[];
  for(let index=0;index<=early.length;index++){
    order.push(...bonus.filter((_,slot)=>Math.floor([5,8,11,13,15][slot]*early.length/EARLY_DECISIONS.length)===index));
    if(index<early.length)order.push(early[index]);
  }
  return [...order,...CLOSING_ROUNDS];
}

function pressOutcome(player,used,mixed=false){
  const critical=mixed&&Math.random()<.5;
  const stories=critical?CRITICAL_PRESS_STORIES:PRESS_STORIES;
  const title=critical?'Nota crítica de prensa':'Reconocimiento de prensa';
  const benefits=Object.keys(stories).flatMap(key=>{
    const decreases=(key==='riesgo_legal')!==critical;
    const room=decreases?player.stats[key]:100-player.stats[key];
    return Array.from({length:Math.min(24,room)},(_,index)=>({key,amount:index+1}));
  });
  const fresh=benefits.filter(({key,amount})=>!used.some(entry=>entry.key===key||entry.amount===amount));
  const distinct=benefits.filter(({key,amount})=>!used.some(entry=>entry.key===key&&entry.amount===amount));
  const pool=fresh.length?fresh:distinct.length?distinct:benefits;
  if(!pool.length)return {key:'prensa',title,story:critical?'Un periodista publicó una nota crítica. Los indicadores ya estaban en su límite inferior de desempeño.':'¡Felicidades! Un periodista reconocido escribió una nota elogiando a la empresa. Sus indicadores ya estaban en su mejor nivel.',changes:{}};
  const {key,amount}=pool[Math.floor(Math.random()*pool.length)];
  used.push({key,amount});
  return {key:'prensa_'+key,title,story:stories[key],changes:{[key]:(key==='riesgo_legal')!==critical?-amount:amount}};

function renderBoard(){return leaderboard().map((p,i)=>`<div class="leader"><div class="rank">${i+1}</div><div><strong>${teamName(p)}</strong><div class="ranktext">Integridad: ${p.stats.integridad} · Finanzas: ${p.stats.finanzas} · Riesgo legal: ${p.stats.riesgo_legal}</div></div><div class="pts">${p.total}</div></div>`).join('')||'<p class="muted">Aún no se ha unido ningún equipo.</p>'}
function bonusRoundPositions(){
  return roundOrder().flatMap((id,index)=>ROUND[id-1].press?[index+1]:[]);
}
function roundMap(position,total,bonuses){
  return `<div class="round-map" role="img" aria-label="Avance de partida: ronda ${position} de ${total}">${Array.from({length:total},(_,index)=>{
    const number=index+1;
    const classes=[number<position?'done':'',bonuses.includes(number)?'bonus':'',number===position?'now':''].join(' ');
    return `<i class="${classes}" title="Ronda ${number}${bonuses.includes(number)?' · Comodín':''}" aria-hidden="true"></i>`;
  }).join('')}</div>`;
}
function roundVisual(q,total=roundOrder().length,bonuses=bonusRoundPositions()){
  return `${roundMap(q.position??q.n,total,bonuses)}<div class="round-visual round-art-${q.art??q.n}"><span>Ronda ${q.position??q.n} de ${total} · ${esc(q.theme)}</span></div>`;
}
function roundOption(o,interactive=false,index=0){
  const delay=`data-choice="${esc(o.id)}" style="--option-index:${index}"`;
  const contents=`<span class="letter">${esc(o.id)}</span><div class="answer"><strong>${esc(o.title)}</strong><div class="muted tiny">${esc(o.desc)}</div></div>`;
  if(!interactive)return `<div class="result-card round-option" ${delay}>${contents}</div>`;
  return `<button class="option round-option ${client.chosen===o.id?'chosen':''}" onclick="vote('${esc(o.id)}')" ${delay} ${client.chosen||client.pending?'disabled':''}>${contents}</button>`;
}
function roundStandout(results){
  return results.filter(result=>!result.missing&&Number.isFinite(result.impact))
    .sort((a,b)=>Math.abs(b.impact)-Math.abs(a.impact)||a.impact-b.impact||a.name.localeCompare(b.name))[0];
}
function roundRanking(){
  return leaderboard().map((team,index)=>{
    const left=(Math.min(team.total,0)+25)/125*100;
    const width=Math.abs(team.total)/125*100;
    return `<div class="score-row"><strong class="score-name" title="${esc(team.name)}">${index+1}. ${teamName(team)}</strong><div class="score-track" aria-hidden="true"><i class="score-fill ${team.total<0?'negative':''}" style="--left:${left}%;--width:${width}%;--rank-delay:${Math.min(index,8)*55}ms"></i></div><strong class="score-value">${team.total} pts</strong></div>`;
  }).join('');
}
function decisionComment(result){
  if(!result)return 'El comentario de esta ronda no está disponible.';
  if(result.missing)return 'El equipo no registró una decisión. Sus indicadores conservaron los valores de la ronda anterior.';
  const effects=Object.entries(result.effects??result.changes??{})
    .filter(([key,value])=>key in SCORE_WEIGHTS&&value)
    .sort(([a,x],[b,y])=>Math.abs(y*SCORE_WEIGHTS[b])-Math.abs(x*SCORE_WEIGHTS[a]))
    .slice(0,2).map(([key,value])=>`${LABEL[key]} ${value>0?'+':''}${value}`);
  const impact=result.impact;
  if(!Number.isFinite(impact))return effects.length?'Los efectos del resultado fueron '+effects.join(' y ')+'.':'Consulta el resultado de la decisión para conocer la consecuencia de esta ronda.';
  const outcome=impact>0?`mejoró su puntuación en ${impact} puntos`:impact<0?`redujo su puntuación en ${Math.abs(impact)} puntos`:'dejó su puntuación sin cambio neto';
  return `${result.randomEvent?'El hecho aleatorio':result.automatic?'La nota periodística':'La decisión'} ${outcome}.${effects.length?' Sus efectos más relevantes fueron '+effects.join(' y ')+'.':''}`;
}
function companyReport(player){
  const stats={...INITIAL}, decisions=[];
  for(const entry of player.history){
    const before=computeScore({stats});
    for(const [key,value] of Object.entries(entry.changes??{}))stats[key]=clamp((stats[key]??0)+value);
    if(!entry.choice)continue;
    const title=entry.title??ROUND[entry.round-1]?.options.find(option=>option.id===entry.choice)?.title??'Opción '+entry.choice;
    decisions.push({round:entry.position??entry.round,title,story:entry.story,impact:entry.impact??computeScore({stats})-before});
  }
  decisions.sort((a,b)=>b.impact-a.impact||a.round-b.round);
  const best=decisions.find(entry=>entry.impact>0);
  const worst=[...decisions].reverse().find(entry=>entry.impact<0);
  const alert=player.history.find(entry=>entry.round===2&&entry.choice==='A');
  const pending=['sin_sancion_inmediata','cargos_pendientes','soborno_oculto'].includes(alert?.event)&&!player.history.some(entry=>entry.round===14&&entry.followUp==='atendida');
  const risks=Object.entries(SCORE_WEIGHTS).map(([key,weight])=>({key,gap:weight<0?-weight*player.stats[key]:weight*(100-player.stats[key])}));
  risks.sort((a,b)=>b.gap-a.gap);
  const key=risks[0].key;
  const risk=pending?'Sigue abierta la alerta de la ronda 2. El siguiente CEO recibe una revisión pendiente sobre esa operación.':!risks[0].gap?'Los indicadores terminaron en su nivel óptimo. El desafío es mantenerlos.':`${LABEL[key]} quedó en ${player.stats[key]}/100 y es el indicador que más limita el puntaje final.`;
  return {best,worst,risk};
}
function renderCompanyReport(report){
  const entry=(decision,fallback)=>decision?`<p><strong>Ronda ${decision.round} · ${esc(decision.title)}</strong> (${decision.impact>0?'+':''}${decision.impact} pts)</p><p>${esc(decision.story)}</p>`:`<p>${fallback}</p>`;
  return `<div class="result-card"><h3>Mejor decisión</h3>${entry(report.best,'Ninguna decisión elevó el puntaje.')}</div>
    <div class="result-card"><h3>Mayor error</h3>${entry(report.worst,'Ninguna decisión redujo el puntaje.')}</div>
    <div class="result-card"><h3>Riesgo para el siguiente CEO</h3><p>${esc(report.risk)}</p></div>`;
}
function renderRoundResults(){
  const results=Object.values(state.results);
  const standout=roundStandout(results);
  const impact=standout?.impact??0;
  const label=current().press?current().theme:impact<0?'Mayor retroceso':impact>0?'Mayor avance':standout?'Equipo destacado':'Consecuencias reveladas';
  const story=standout?.story??(results.some(result=>!result.missing)?'Consulta las consecuencias de esta ronda.':'Ningún equipo registró una decisión en esta ronda.');
  const formula=Object.entries(SCORE_WEIGHTS).map(([key,weight],index)=>`${index?(weight<0?'− ':'+ '):''}${Math.abs(weight)}% de ${LABEL[key].toLowerCase()}`).join(' ');
  view().innerHTML=`<div class="round-close">
    <section class="round-reveal round-art-${current().art??current().n} ${impact<0?'setback':''}" aria-labelledby="reveal-name">
      <div class="reveal-backdrop" aria-hidden="true"></div>
      ${roundMap(state.round+1,roundOrder().length,bonusRoundPositions())}<div class="reveal-label">Ronda ${state.round+1} de ${roundOrder().length} · ${label}</div>
      <h1 class="reveal-name" id="reveal-name">${standout?teamName(standout):'Cierre de ronda'}</h1>
      <p class="reveal-story">${esc(story)}</p>
      ${standout?`<p class="impact-comment"><strong>${esc(standout.title)}.</strong> ${esc(decisionComment(standout))}</p>`:''}
    </section>
    <section class="panel round-board" aria-labelledby="ranking-title">
      <h2 id="ranking-title">Clasificación general</h2>
      <div class="score-axis muted" aria-hidden="true"><span>Equipo</span><div class="score-axis-track"><span>−25</span><span>0</span><span>100</span></div><span></span></div>
      <div class="score-lines" tabindex="0" aria-label="Puntuación por equipo">${roundRanking()}</div>
    </section>
    <div class="round-controls"><div>${state.advanceAt?`<span id="advance-countdown" class="tiny muted"></span> <button class="btn alt" id="pause-advance" onclick="pauseAdvance()">Pausar avance</button> `:''}<button class="btn alt" onclick="$('score-rule').showModal()">Fórmula</button> <button class="btn alt" onclick="$('round-details').showModal()">Consecuencias por equipo</button></div>${finalJumpButton()}<button class="btn" onclick="nextRound()">${state.round===roundOrder().length-1?'Ver resultado final':'Siguiente ronda →'}</button></div>
    <dialog class="round-dialog" id="score-rule"><h2>Cómo se calculan los puntos</h2><p>Se redondea la suma ponderada al entero más cercano. Los indicadores van de 0 a 100.</p><p>${esc(formula)}.</p><form method="dialog"><button class="btn alt">Cerrar</button></form></dialog>
    <dialog class="round-dialog" id="round-details"><h2>Consecuencias por equipo</h2><form method="dialog"><button class="btn alt">Cerrar</button></form>
      ${results.map(result=>`<div class="result-card"><strong>${teamName(result)} · ${result.missing?'No votó':esc(result.automatic?result.title:result.choice+'. '+result.title)}</strong><p>${esc(result.missing?'Sin consecuencias en esta ronda.':result.story)}</p><p class="notice">${esc(decisionComment(result))}</p>${result.missing?'':`<div class="tiny muted">${result.automatic?'':`Tirada: ${result.roll}/100 · Probabilidad: ${result.prob}% · `}${Object.entries(result.effects??result.changes).map(([key,value])=>esc(LABEL[key]||key)+': '+(value>=0?'+':'')+value).join(' · ')}</div>`}</div>`).join('')}
    </dialog>
  </div>`;
}
function renderHost(){if(role!=='host')return;enterScreen('host:'+state.phase+':'+state.round,state.phase);$('host-controls').hidden=false;document.body.classList.toggle('round-results',state.phase==='results');const joinUrl=location.href.split('?')[0].split('#')[0]+'?room='+room;const roomHeader=`<div class="tag">Anfitrión · Sala ${room}</div>`;if(state.phase==='lobby'){view().innerHTML=`<div class="split"><div class="panel">${roomHeader}<h1 class="hero">La sala está lista</h1><p>Comparte el código o proyecta el QR. Cada equipo entra desde un celular.</p><div class="bigcode">${room}</div><p class="muted">${esc(joinUrl)}</p><div class="flex"><div id="qrcode" class="qr"></div><div><p class="muted">Equipos conectados: <strong>${allJoined()}</strong></p><label for="decision-count">¿Cuántas decisiones quieren jugar?</label><select class="input" id="decision-count" onchange="setDecisionCount(this.value)">${Array.from({length:17},(_,index)=>index+4).map(count=>`<option value="${count}" ${state.decisionCount===count?'selected':''}>${count} decisiones</option>`).join('')}</select><p id="round-count-summary" class="tiny muted">${wildcardCount(state.decisionCount)} comodines · ${roundOrder().length} rondas en total</p><button class="btn" onclick="startRound()">Comenzar ronda 1</button></div></div><div class="space"></div><div class="notice">Puedes recargar esta pestaña y seguir con el mismo código. Usa este navegador para recuperar la sala.</div></div><div class="panel"><h2>Equipos inscritos</h2>${renderBoard()}</div></div>`;if(typeof QRCode!=='undefined')new QRCode($('qrcode'),{text:joinUrl,width:170,height:170});else $('qrcode').innerText=room;return}
if(state.phase==='question'){const q=current(),votes=Object.keys(state.submitted).length;view().innerHTML=`<div class="split"><div class="panel">${roomHeader}${roundVisual(q)}<h1 class="hero">${esc(q.title)}</h1><p class="question">${esc(q.scenario)}</p><div class="space"></div><div class="round-options">${q.options.map((o,index)=>roundOption(o,false,index)).join('')}</div><div class="space"></div><div class="flex"><span class="pill">Han votado ${votes}/${allJoined()}</span><button class="btn" onclick="reveal()">Revelar consecuencias</button>${finalJumpButton()}</div></div><div class="panel"><h2>Clasificación</h2>${renderBoard()}<hr class="divider"><div class="tag">Votación</div><p class="muted">Las decisiones individuales permanecen ocultas hasta revelar.</p><div class="bar"><i style="width:${allJoined()?votes/allJoined()*100:0}%"></i></div></div></div>`;return}
if(state.phase==='results'){renderRoundResults();return}
if(state.phase==='finished'){view().innerHTML=`<div class="panel center"><div class="tag">Final de la simulación</div><h1 class="hero">El legado del consejo</h1>${winnerBanner(leaderboard())}<p>La clasificación combina finanzas, integridad, reputación y responsabilidad social. El riesgo legal descuenta puntos.</p><div style="max-width:720px;margin:25px auto;text-align:left">${renderBoard()}</div><div class="space"></div><button class="btn alt" onclick="$('final-reports').showModal()">Informes por empresa</button> <button class="btn alt" onclick="downloadCSV()">Descargar resultados CSV</button> <button class="btn" onclick="newGame()">Nueva partida</button></div><dialog class="round-dialog" id="final-reports"><h2>Informes por empresa</h2><form method="dialog"><button class="btn alt">Cerrar</button></form>${leaderboard().map(team=>`<details class="result-card"><summary>${teamName(team)} · ${team.total} pts</summary>${renderCompanyReport(companyReport(state.players[team.id]))}</details>`).join('')}</dialog>`}}
function renderPlayerLobby(snapshot){
  if(!$('lobby-profile')){
    view().innerHTML=`<section class="panel lobby-editor">
      <div class="tag">Sala ${room} · Lobby de espera</div>
      <h1 class="hero">Estás dentro</h1>

        </fieldset>

function saveLobbyProfile(event){
  event.preventDefault();
  if(client.snapshot?.phase!=='lobby'||!hostConn?.open)return;
  const profile=new FormData(event.currentTarget);
  $('profile-feedback').textContent='Guardando…';
  send(hostConn,{type:'profile',name:profile.get('team'),icon:Number(profile.get('icon'))});
}
function renderPlayer(){if(role!=='player')return;const snap=client.snapshot;enterScreen('player:'+(snap?.phase??'waiting')+':'+(snap?.round??''),snap?.phase??'waiting');if(!snap){view().innerHTML=`<div class="panel center"><h2>Conectado al juego</h2><p>El anfitrión está preparando la sala.</p></div>`;return}const title=`<div class="tag">${teamName(client)} · Sala ${room}</div>`;if(snap.phase==='lobby'){renderPlayerLobby(snap);return}if(snap.phase==='question'){const q=snap.question;view().innerHTML=`<div class="panel">${title}${roundVisual(q,snap.roundCount,snap.bonusRounds??[])}<h1 class="hero">${esc(q.title)}</h1><p>${esc(q.scenario)}</p><hr class="divider"><div class="round-options">${q.options.map((o,index)=>roundOption(o,true,index)).join('')}</div><div class="space"></div><p class="muted center">${client.chosen?'✓ Tu respuesta está registrada. Espera al anfitrión.':client.pending?'Enviando tu voto…':'Selecciona una decisión. No podrás cambiarla después.'}</p></div>`;return}if(snap.phase==='results'){const mine=snap.results?.[client.id];view().innerHTML=`<div class="panel">${title}<div class="tag">Ronda ${snap.round+1} · Resultado</div><h1 class="hero">${mine?.missing?'No votaste':esc(mine?.story||'Resultado registrado')}</h1><div class="notice"><strong>Comentario para tu equipo</strong>${mine&&!mine.missing?`<p>${mine.randomEvent?'Hecho':mine.automatic?'Nota':'Decisión'}: ${esc(mine.title)}</p>`:''}<p>${esc(decisionComment(mine))}</p></div><h2>Clasificación</h2>${snap.leaderboard.map((p,i)=>`<div class="score"><span>${i+1}. ${teamName(p)}</span><b>${p.total} pts</b></div>`).join('')}<p class="muted">Espera a la siguiente ronda.</p></div>`;return}if(snap.phase==='finished'){view().innerHTML=`<div class="panel center">${title}<h1 class="hero">Partida terminada</h1>${winnerBanner(snap.leaderboard)}<h2>Clasificación final</h2>${snap.leaderboard.map((p,i)=>`<div class="score"><span>${i+1}. ${teamName(p)}</span><b>${p.total} pts</b></div>`).join('')}</div>${snap.report?`<section class="panel"><h2>Informe final de tu empresa</h2>${renderCompanyReport(snap.report)}</section>`:''}`}}
function vote(option){
  if(client.chosen||client.pending||!hostConn?.open)return;
  const round=client.snapshot.round;
  client.pending=option;
  send(hostConn,{type:'vote',round,option});
  renderPlayer();
  setTimeout(()=>{
    if(client.snapshot?.round===round&&client.pending===option){
      client.pending=null;
      renderPlayer();
      status('Voto sin confirmar · Reintenta');
    }
  },5000);
}
function downloadCSV(){const rows=[['Posición','Equipo','Puntos',...Object.keys(INITIAL),'Historial']];leaderboard().forEach((p,i)=>{const full=state.players[p.id];rows.push([i+1,p.name,p.total,...Object.keys(INITIAL).map(k=>p.stats[k]),full.history.map(h=>h.round+':'+h.choice+'('+h.event+')').join('; ')])});const csv='\ufeff'+rows.map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultados_el_ceo.csv';a.click();URL.revokeObjectURL(url)}
const requestedRoom=(qs.get('room')||'').toUpperCase();
if(qs.has('room')){
  showJoin();
  if(/^[A-Z0-9]{6}$/.test(requestedRoom)&&typeof Peer!=='undefined'){
    room=requestedRoom;
    client.name=localStorage.getItem(playerSave())||'';
    if(client.name)connectPlayer();
  }
}else{
  const saved=restoreHost();
  if(saved)startHost(saved);else landing();
}
window.addEventListener('pagehide',()=>{const instance=peer;peer=null;instance?.destroy();});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
